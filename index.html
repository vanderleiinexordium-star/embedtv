<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b11"><<title>PlayBibosTV — TV ao vivo</title>
<style>
:root{color-scheme:dark;--bg:#080a10;--panel:#111621;--line:#252d3c;--muted:#9aa4b5;--red:#f32650}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fb;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#090b11ed;border-bottom:1px solid #202634;padding:16px clamp(16px,4vw,44px);display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{font-weight:950;font-size:clamp(24px,4vw,34px);letter-spacing:-1.5px}.logo span{color:var(--red)}
input{background:#141a26;border:1px solid #2a3344;border-radius:16px;color:white;padding:14px 17px;font-size:16px;outline:none;width:min(360px,55vw)}
main{max-width:1250px;margin:auto;padding:26px clamp(16px,4vw,40px) 60px}
.player{background:#030407;border:1px solid var(--line);border-radius:24px;overflow:hidden;margin:10px 0 26px}
video{display:block;width:100%;aspect-ratio:16/9;background:#030407;max-height:68vh}
.player-info{padding:15px 18px;display:flex;align-items:center;gap:14px;border-top:1px solid var(--line)}
.channel-icon{width:54px;height:54px;object-fit:contain;border-radius:13px;background:#192131;padding:7px}
.muted{color:var(--muted)}.live{margin-left:auto;color:#ff718b;font-weight:800;letter-spacing:1px;font-size:13px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
.chip{border:1px solid var(--line);border-radius:999px;background:transparent;color:#c3cada;padding:10px 18px;cursor:pointer;font-weight:700}
.chip.active{background:var(--red);border-color:var(--red);color:white}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;min-height:142px;text-align:center;cursor:pointer;color:white}
.card:hover,.card:focus{border-color:var(--red);transform:translateY(-2px)}
.card-wrap{position:relative;min-width:0}.fav-toggle{position:absolute;right:8px;top:8px;border:1px solid #394356;background:#080a10e8;color:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:17px}.fav-toggle.active{color:#ffcf58;border-color:#ffcf58}
.card img{width:68px;height:68px;object-fit:contain;margin:0 auto 8px;display:block}
.card b{display:block;font-size:14px;overflow-wrap:anywhere}
.notice{border:1px dashed #394356;border-radius:20px;padding:26px;text-align:center;color:var(--muted)}
.error{color:#ff8da2}.small{font-size:13px}
@media(max-width:560px){header{align-items:flex-start;flex-direction:column}input{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-info{gap:10px}.live{font-size:11px}}
</style>
</head>
<body>
<header><<header><div class="logo">PLAYBIBOS<span>TV</span></div> input id="search" placeholder="Buscar canal..." aria-label="Buscar canal" autocomplete="off"></header>
<main>
<section class="player">
<video id="video" controls playsinline></video>
<div class="player-info"><img id="currentLogo" class="channel-icon" alt="" src=""><div><strong id="currentName">Escolha um canal para assistir</strong><div class="muted" id="currentDesc">A transmissão selecionada aparecerá aqui.</div></div><div class="live">● AO VIVO</div></div>
</section>
<div class="controls" id="categories"><button class="chip active" data-category="all">Todos</button><button class="chip" data-category="favorites">★ Favoritos</button></div>
<div class="section-head"><h2 id="listTitle">Todos os canais</h2><span class="muted small" id="status">Carregando catálogo…</span></div>
<div id="channels" class="grid"><div class="notice">Buscando canais…</div></div>
<div class="section-head"><button class="chip" id="previousPage" type="button" disabled>← Anterior</button><span class="muted small" id="pageInfo">Página 1</span><button class="chip" id="nextPage" type="button" disabled>Próxima →</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const API='/.netlify/functions/channels';
const $=id=>document.getElementById(id);
const PAGE_SIZE=60;
let all=[], category='all', favorites=JSON.parse(localStorage.getItem('embedtv-favs')||'[]'), hls=null;
let currentPage=1,totalPages=1,searchTimer=null,requestToken=0;
let categoryNames=[];
function safeUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function makeButton(label, active, action){const b=document.createElement('button');b.type='button';b.className='chip'+(active?' active':'');b.textContent=label;b.onclick=action;return b}
function renderCategories(){
 const root=$('categories');root.innerHTML='';
 root.append(makeButton('Todos',category==='all',()=>chooseCategory('all')));
 root.append(makeButton('★ Favoritos',category==='favorites',()=>chooseCategory('favorites')));
 categoryNames.forEach(name=>root.append(makeButton(name,category===name,()=>chooseCategory(name))));
}
function chooseCategory(next){category=next;currentPage=1;renderCategories();loadChannels();}
function render(){
 const root=$('channels');root.innerHTML='';
 let items=all;
 if(category==='favorites') items=items.filter(c=>favorites.includes(c.id));
 if(!items.length){root.innerHTML='<div class="notice">Nenhum canal encontrado nesta página. Tente outra categoria ou busca.</div>';return}
 items.forEach(c=>{
  const wrap=document.createElement('div');wrap.className='card-wrap';
  const el=document.createElement('button');el.className='card';el.type='button';
  const img=document.createElement('img');img.alt='';img.loading='lazy';img.src=safeUrl(c.logo)||'';img.onerror=()=>{img.style.display='none'};
  const name=document.createElement('b');name.textContent=(favorites.includes(c.id)?'★ ':'')+c.name;
  const cat=document.createElement('span');cat.className='muted small';cat.textContent=c.category;
  el.append(img,name,cat);el.onclick=()=>play(c);
  const fav=document.createElement('button');fav.type='button';fav.className='fav-toggle'+(favorites.includes(c.id)?' active':'');fav.textContent=favorites.includes(c.id)?'★':'☆';fav.setAttribute('aria-label',favorites.includes(c.id)?'Remover dos favoritos':'Adicionar aos favoritos');
  fav.onclick=(event)=>{event.stopPropagation();favorites=favorites.includes(c.id)?favorites.filter(id=>id!==c.id):[...favorites,c.id];localStorage.setItem('embedtv-favs',JSON.stringify(favorites));if(category==='favorites')loadChannels();else render()};
  wrap.append(el,fav);root.append(wrap);
 });
}
function updatePager(){
 $('pageInfo').textContent=`Página ${currentPage} de ${Math.max(1,totalPages)}`;
 $('previousPage').disabled=currentPage<=1;
 $('nextPage').disabled=currentPage>=totalPages;
}
async function loadCategories(){
 const response=await fetch(API+'?action=categories',{headers:{Accept:'application/json'}});
 const data=await response.json();if(!response.ok)throw new Error(data.error||'Falha ao carregar categorias.');
 categoryNames=(data.categories||[]).map(c=>c.name).filter(Boolean);
 renderCategories();
}
async function loadChannels(){
 const token=++requestToken;
 $('status').textContent='Carregando canais…';
 $('channels').innerHTML='<div class="notice">Carregando catálogo…</div>';
 const params=new URLSearchParams({action:'channels',page:String(currentPage),limit:String(PAGE_SIZE)});
 if(category==='favorites'){if(!favorites.length){all=[];$('status').textContent='0 favoritos';render();totalPages=1;updatePager();return;}params.set('favorites',favorites.join(','));}
 const query=$('search').value.trim();if(query)params.set('q',query);
 if(category!=='all'&&category!=='favorites')params.set('category',category);
 try{
  const response=await fetch(API+'?'+params.toString(),{headers:{Accept:'application/json'}});
  const data=await response.json();if(!response.ok)throw new Error(data.error||`Erro HTTP ${response.status}`);
  if(token!==requestToken)return;
  all=data.channels||[];totalPages=data.totalPages||1;
  $('status').textContent=`${Number(data.total||0).toLocaleString('pt-BR')} resultados`;
  $('listTitle').textContent=category==='favorites'?'Favoritos':category==='all'?'Todos os canais':category;
  render();updatePager();
 }catch(error){
  if(token!==requestToken)return;
  $('status').textContent='Fonte indisponível';
  $('channels').innerHTML='';
  const notice=document.createElement('div');notice.className='notice';
  const title=document.createElement('h3');title.textContent='Não foi possível carregar o catálogo';
  const detail=document.createElement('p');detail.className='error';detail.textContent=error.message||String(error);
  const retry=makeButton('Tentar novamente',true,loadChannels);notice.append(title,detail,retry);$('channels').append(notice);
 }
}
function play(channel){
 const src=safeUrl(channel.url);$('currentName').textContent=channel.name;
 $('currentDesc').textContent=src?'Transmissão selecionada':'Endereço de transmissão indisponível';
 const logo=safeUrl(channel.logo);$('currentLogo').src=logo;$('currentLogo').style.visibility=logo?'visible':'hidden';
 const video=$('video');if(hls){hls.destroy();hls=null;}
 const oldFrame=$('channelFrame');if(oldFrame)oldFrame.remove();
 video.pause();video.removeAttribute('src');video.load();video.style.display='block';
 if(!src)return;
 if(/\.m3u8(?:$|[?#])/i.test(src)&&window.Hls&&Hls.isSupported()){
  hls=new Hls();hls.loadSource(src);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
 }else if(/\.(mp4|webm|ogg)(?:$|[?#])/i.test(src)){
  video.src=src;video.play().catch(()=>{});
 }else{
  video.style.display='none';const frame=document.createElement('iframe');frame.id='channelFrame';frame.src=src;
  frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';frame.allowFullscreen=true;
  frame.title='Player de '+channel.name;frame.style.cssText='width:100%;height:100%;min-height:240px;aspect-ratio:16/9;border:0;background:#000';
  video.parentNode.insertBefore(frame,video.nextSibling);
 }
}
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{currentPage=1;loadChannels()},350)});
$('previousPage').onclick=()=>{if(currentPage>1){currentPage--;loadChannels()}};
$('nextPage').onclick=()=>{if(currentPage<totalPages){currentPage++;loadChannels()}};
async function start(){
 $('status').textContent='Conectando à playlist…';
 try{await loadCategories();await loadChannels();}
 catch(error){$('status').textContent='Falha ao iniciar';$('channels').innerHTML='';const n=document.createElement('div');n.className='notice';n.textContent=error.message||String(error);$('channels').append(n)}
}
start();
</script>
</body></html>
