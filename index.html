<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b11"><title>EMBEDTV — TV ao vivo</title>
<style>
:root{color-scheme:dark;--bg:#080a10;--panel:#111621;--line:#252d3c;--muted:#9aa4b5;--red:#f32650}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fb;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#090b11ed;border-bottom:1px solid #202634;padding:16px clamp(16px,4vw,44px);display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{font-weight:950;font-size:clamp(24px,4vw,34px);letter-spacing:-1.5px}.logo span{color:var(--red)}
input{background:#141a26;border:1px solid #2a3344;border-radius:16px;color:white;padding:14px 17px;font-size:16px;outline:none;width:min(360px,55vw)}
main{max-width:1250px;margin:auto;padding:26px clamp(16px,4vw,40px) 60px}
.player{background:#030407;border:1px solid var(--line);border-radius:24px;overflow:hidden;margin:10px 0 26px}
video{display:block;width:100%;aspect-ratio:16/9;background:#030407;max-height:68vh}
.player-info{padding:15px 18px;display:flex;align-items:center;gap:14px;border-top:1px solid var(--line)}
.channel-icon{width:54px;height:54px;object-fit:contain;border-radius:13px;background:#192131;padding:7px}
.muted{color:var(--muted)}.live{margin-left:auto;color:#ff718b;font-weight:800;letter-spacing:1px;font-size:13px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
.chip{border:1px solid var(--line);border-radius:999px;background:transparent;color:#c3cada;padding:10px 18px;cursor:pointer;font-weight:700}
.chip.active{background:var(--red);border-color:var(--red);color:white}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;min-height:142px;text-align:center;cursor:pointer;color:white}
.card:hover,.card:focus{border-color:var(--red);transform:translateY(-2px)}
.card img{width:68px;height:68px;object-fit:contain;margin:0 auto 8px;display:block}
.card b{display:block;font-size:14px;overflow-wrap:anywhere}
.notice{border:1px dashed #394356;border-radius:20px;padding:26px;text-align:center;color:var(--muted)}
.error{color:#ff8da2}.small{font-size:13px}
@media(max-width:560px){header{align-items:flex-start;flex-direction:column}input{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-info{gap:10px}.live{font-size:11px}}
</style>
</head>
<body>
<header><div class="logo">EMBED<span>TV</span></div><input id="search" placeholder="Buscar canal..." aria-label="Buscar canal"></header>
<main>
<section class="player">
<video id="video" controls playsinline></video>
<div class="player-info"><img id="currentLogo" class="channel-icon" alt="" src=""><div><strong id="currentName">Escolha um canal para assistir</strong><div class="muted" id="currentDesc">A transmissão selecionada aparecerá aqui.</div></div><div class="live">● AO VIVO</div></div>
</section>
<div class="controls" id="categories"><button class="chip active" data-category="all">Todos</button><button class="chip" data-category="favorites">★ Favoritos</button></div>
<div class="section-head"><h2 id="listTitle">Todos os canais</h2><span class="muted small" id="status">Carregando canais…</span></div>
<div id="channels" class="grid"><div class="notice">Buscando canais…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const API='/.netlify/functions/channels';
const $=id=>document.getElementById(id);
let all=[], category='all', favorites=JSON.parse(localStorage.getItem('embedtv-favs')||'[]'), hls=null;
function normalize(payload){
 let list=Array.isArray(payload)?payload:(payload?.channels||payload?.data||payload?.results||payload?.items||[]);
 if(!Array.isArray(list)) return [];
 return list.map((x,i)=>{
  let urls=x.url??x.stream_url??x.stream??x.src??x.m3u8??x.link??'';
  if(Array.isArray(urls)) urls=urls[0]||'';
  if(urls&&typeof urls==='object') urls=urls.url||urls.src||'';
  return {id:String(x.id??x.slug??i),name:x.name??x.title??x.nome??`Canal ${i+1}`,logo:x.logo??x.image??x.poster??x.icon??'',cat:x.category??x.group??x.categoria??'Outros',url:typeof urls==='string'?urls:''};
 }).filter(x=>x.name);
}
function safeUrl(s){try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function render(){
 const q=$('search').value.toLowerCase();
 let items=all.filter(c=>(category==='all'||(category==='favorites'?favorites.includes(c.id):c.cat===category))&&(`${c.name} ${c.cat}`).toLowerCase().includes(q));
 $('listTitle').textContent=category==='favorites'?'Favoritos':category==='all'?'Todos os canais':category;
 $('channels').innerHTML='';
 if(!items.length){$('channels').innerHTML='<div class="notice">Nenhum canal encontrado.</div>';return}
 items.forEach(c=>{
  const el=document.createElement('button');el.className='card';el.type='button';
  const img=document.createElement('img');img.alt='';img.src=safeUrl(c.logo)||'';
  img.onerror=()=>{img.style.display='none'};
  const name=document.createElement('b');name.textContent=(favorites.includes(c.id)?'★ ':'')+c.name;
  const cat=document.createElement('span');cat.className='muted small';cat.textContent=c.cat;
  el.append(img,name,cat);el.onclick=()=>play(c);$('channels').append(el);
 });
}
function play(c){
 const src=safeUrl(c.url);
 $('currentName').textContent=c.name;$('currentDesc').textContent=src?'Reproduzindo transmissão selecionada':'A API não informou um link direto de reprodução para este canal.';
 $('currentLogo').src=safeUrl(c.logo);$('currentLogo').style.visibility=safeUrl(c.logo)?'visible':'hidden';
 const v=$('video');if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();
 if(!src)return;
 if(window.Hls&&Hls.isSupported()&&src.includes('.m3u8')){hls=new Hls();hls.loadSource(src);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}))}
 else if(v.canPlayType('application/vnd.apple.mpegurl')||!src.includes('.m3u8')){v.src=src;v.play().catch(()=>{})}
}
function categories(){
 const cats=[...new Set(all.map(c=>c.cat).filter(Boolean))].sort();
 $('categories').innerHTML='';
 [['all','Todos'],['favorites','★ Favoritos'],...cats.map(c=>[c,c])].forEach(([id,label],i)=>{
  const b=document.createElement('button');b.className='chip'+(category===id?' active':'');b.textContent=label;b.dataset.category=id;b.onclick=()=>{category=id;categories();render()};$('categories').append(b);
 });
}
$('search').addEventListener('input',render);
async function load(){
 $('status').textContent='Conectando à fonte…';
 try{
  const r=await fetch(API,{headers:{'Accept':'application/json'}});
  const data=await r.json();
  if(!r.ok) throw new Error(data.error||`HTTP ${r.status}`);
  all=normalize(data);
  if(!all.length) throw new Error('A resposta da API não contém uma lista de canais reconhecível.');
  $('status').textContent=`${all.length} canais`;
  categories();render();
 }catch(e){
  $('status').textContent='Fonte indisponível';
  $('channels').innerHTML=`<div class="notice"><h3>Não foi possível carregar os canais</h3><p class="error">${String(e.message||e)}</p><p>O proxy do site tentou consultar a API. Se o erro persistir, a fonte pode estar indisponível ou exigir outro formato de acesso.</p><button class="chip active" onclick="load()">Tentar novamente</button></div>`;
 }
}
load();
</script>
</body></html>
