<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="description" content="PlayBibosTV — seus canais ao vivo em um só lugar">
<title>PlayBibosTV — TV ao vivo</title>
<style>
:root{color-scheme:dark;--bg:#08090d;--surface:#11141c;--surface-2:#171b25;--line:#292e3b;--muted:#a0a7b5;--red:#f32650;--red-dark:#c9143b;--text:#f7f8fb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#25101a 0%,transparent 42%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(8,9,13,.94);backdrop-filter:blur(14px);border-bottom:1px solid #242833;padding:15px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-weight:950;font-size:clamp(24px,4vw,34px);letter-spacing:-1.6px;white-space:nowrap;text-shadow:0 4px 24px #f3265033}
.logo span{color:var(--red)}
input{background:#141923;border:1px solid #303747;border-radius:14px;color:white;padding:13px 17px;font-size:16px;outline:none;width:min(380px,55vw);transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px #f3265026}
main{width:min(1440px,100%);margin:auto;padding:clamp(18px,3vw,34px) clamp(14px,4vw,42px) 64px}
.player{background:#030407;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:4px 0 26px;box-shadow:0 18px 55px #0008}
video{display:block;width:100%;aspect-ratio:16/9;background:#030407;max-height:70vh;object-fit:contain}
.player-info{padding:14px 18px;display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);min-height:82px}
.channel-icon{width:52px;height:52px;object-fit:contain;border-radius:13px;background:#1b2230;padding:7px;flex:none}
.muted{color:var(--muted)}.live{margin-left:auto;color:#ff718b;font-weight:850;letter-spacing:1px;font-size:12px;white-space:nowrap}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 25px}
.chip{border:1px solid #303747;border-radius:999px;background:#11141c;color:#cbd0da;padding:10px 17px;cursor:pointer;font-weight:700;transition:background .18s,border-color .18s,transform .18s}
.chip:hover{border-color:#ed496a;color:#fff}.chip.active{background:var(--red);border-color:var(--red);color:white;box-shadow:0 5px 18px #f3265030}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 14px}
.section-head h2{font-size:clamp(19px,2.3vw,24px);letter-spacing:-.4px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.card-wrap{position:relative;min-width:0}
.card{width:100%;height:154px;background:linear-gradient(145deg,#171c27,#10131b);border:1px solid #282f3d;border-radius:17px;padding:18px 12px 13px;text-align:center;cursor:pointer;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:transform .18s,border-color .18s,background .18s}
.card:hover,.card:focus-visible{border-color:var(--red);background:#1a1d28;transform:translateY(-3px);outline:none;box-shadow:0 8px 24px #0005}
.card img{width:66px;height:66px;object-fit:contain;display:block}
.card b{display:block;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.fav-toggle{position:absolute;right:7px;top:7px;border:1px solid #394356;background:#080a10e8;color:#fff;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:17px;z-index:2}
.fav-toggle.active{color:#ffcf58;border-color:#ffcf58}
.notice{border:1px dashed #394356;border-radius:18px;padding:26px;text-align:center;color:var(--muted);grid-column:1/-1}\n.playlist-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0;padding:15px;background:#11141c;border:1px solid var(--line);border-radius:16px}.playlist-tools strong{width:100%}.playlist-tools input[type=url]{flex:1;min-width:220px;width:auto}.playlist-tools input[type=file]{width:auto;max-width:100%;font-size:13px}.playlist-tools .chip{white-space:nowrap}
.error{color:#ff8da2}.small{font-size:13px}
button:focus-visible{outline:3px solid #ff6d8b;outline-offset:3px}
@media(max-width:700px){header{padding:13px 16px;gap:12px}.logo{font-size:25px}input{width:min(52vw,330px);padding:11px 12px}main{padding:16px 12px 42px}.player{border-radius:16px;margin-bottom:20px}.player-info{padding:11px 12px;min-height:70px}.channel-icon{width:44px;height:44px}.controls{gap:7px;margin:18px 0}.chip{padding:9px 13px;font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{height:138px;padding:15px 9px 11px;border-radius:14px}.card img{width:58px;height:58px}.card b{font-size:13px}.section-head{margin:18px 0 12px}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{height:166px}}
@media(min-width:900px) and (pointer:fine){.card{height:170px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="logo">PLAYBIBOS<span>TV</span></div><input id="search" placeholder="Buscar canal..." aria-label="Buscar canal" autocomplete="off"></header>
<main>
<section class="player">
<video id="video" controls playsinline></video>
<div class="player-info"><img id="currentLogo" class="channel-icon" alt="" src=""><div><strong id="currentName">Escolha um canal para assistir</strong><div class="muted" id="currentDesc">A transmissão selecionada aparecerá aqui.</div></div><div class="live">● AO VIVO</div></div>
</section>
<section class="playlist-tools" aria-label="Adicionar lista M3U">
<strong>📺 Minha lista M3U</strong>
<input id="playlistUrl" type="url" placeholder="Cole aqui o link da sua lista M3U" aria-label="Link da lista M3U" autocomplete="off">
<button class="chip active" id="loadPlaylist" type="button">Carregar lista</button>
<label class="chip" for="playlistFile">Abrir arquivo .m3u</label><input id="playlistFile" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,application/x-mpegURL">
<button class="chip" id="defaultPlaylist" type="button">Canais padrão</button>
<span class="muted small" id="playlistMessage">Sua lista será usada somente nesta sessão.</span>
</section>
<div class="controls" id="categories"><button class="chip active" data-category="all">Todos</button><button class="chip" data-category="favorites">★ Favoritos</button></div>
<div class="section-head"><h2 id="listTitle">Todos os canais</h2><span class="muted small" id="status">Carregando catálogo…</span></div>
<div id="channels" class="grid"><div class="notice">Buscando canais…</div></div>
<div class="section-head"><button class="chip" id="previousPage" type="button" disabled>← Anterior</button><span class="muted small" id="pageInfo">Página 1</span><button class="chip" id="nextPage" type="button" disabled>Próxima →</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const API='/.netlify/functions/channels';
const $=id=>document.getElementById(id);
const PAGE_SIZE=60;
let all=[], category='all', customChannels=null, favorites=JSON.parse(localStorage.getItem('embedtv-favs')||'[]'), hls=null;
let currentPage=1,totalPages=1,searchTimer=null,requestToken=0;
let categoryNames=[];
function safeUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function makeButton(label, active, action){const b=document.createElement('button');b.type='button';b.className='chip'+(active?' active':'');b.textContent=label;b.onclick=action;return b}
function renderCategories(){
 const root=$('categories');root.innerHTML='';
 root.append(makeButton('Todos',category==='all',()=>chooseCategory('all')));
 root.append(makeButton('★ Favoritos',category==='favorites',()=>chooseCategory('favorites')));
 categoryNames.forEach(name=>root.append(makeButton(name,category===name,()=>chooseCategory(name))));
}
function chooseCategory(next){category=next;currentPage=1;renderCategories();loadChannels();}
function render(){
 const root=$('channels');root.innerHTML='';
 let items=all;
 if(category==='favorites') items=items.filter(c=>favorites.includes(c.id));
 if(!items.length){root.innerHTML='<div class="notice">Nenhum canal encontrado nesta página. Tente outra categoria ou busca.</div>';return}
 items.forEach(c=>{
  const wrap=document.createElement('div');wrap.className='card-wrap';
  const el=document.createElement('button');el.className='card';el.type='button';
  const img=document.createElement('img');img.alt='';img.loading='lazy';img.src=safeUrl(c.logo)||'';img.onerror=()=>{img.style.display='none'};
  const name=document.createElement('b');name.textContent=(favorites.includes(c.id)?'★ ':'')+c.name;
  const cat=document.createElement('span');cat.className='muted small';cat.textContent=c.category;
  el.append(img,name,cat);el.onclick=()=>play(c);
  const fav=document.createElement('button');fav.type='button';fav.className='fav-toggle'+(favorites.includes(c.id)?' active':'');fav.textContent=favorites.includes(c.id)?'★':'☆';fav.setAttribute('aria-label',favorites.includes(c.id)?'Remover dos favoritos':'Adicionar aos favoritos');
  fav.onclick=(event)=>{event.stopPropagation();favorites=favorites.includes(c.id)?favorites.filter(id=>id!==c.id):[...favorites,c.id];localStorage.setItem('embedtv-favs',JSON.stringify(favorites));if(category==='favorites')loadChannels();else render()};
  wrap.append(el,fav);root.append(wrap);
 });
}
function updatePager(){
 $('pageInfo').textContent=`Página ${currentPage} de ${Math.max(1,totalPages)}`;
 $('previousPage').disabled=currentPage<=1;
 $('nextPage').disabled=currentPage>=totalPages;
}
async function loadCategories(){
 const response=await fetch(API+'?action=categories',{headers:{Accept:'application/json'}});
 const data=await response.json();if(!response.ok)throw new Error(data.error||'Falha ao carregar categorias.');
 categoryNames=(data.categories||[]).map(c=>c.name).filter(Boolean);
 renderCategories();
}
async function loadChannels(){
 const token=++requestToken;
 if(customChannels){
  let items=customChannels;
  const query=$('search').value.trim().toLocaleLowerCase('pt-BR');
  if(category==='favorites') items=items.filter(c=>favorites.includes(c.id));
  else if(category!=='all') items=items.filter(c=>c.category===category);
  if(query) items=items.filter(c=>c.name.toLocaleLowerCase('pt-BR').includes(query)||c.category.toLocaleLowerCase('pt-BR').includes(query));
  totalPages=Math.max(1,Math.ceil(items.length/PAGE_SIZE));
  currentPage=Math.min(currentPage,totalPages);
  const start=(currentPage-1)*PAGE_SIZE;
  all=items.slice(start,start+PAGE_SIZE);
  $('status').textContent=`${items.length.toLocaleString('pt-BR')} resultados`;
  $('listTitle').textContent=category==='favorites'?'Favoritos':category==='all'?'Minha lista M3U':category;
  render();updatePager();
  return;
 }
 $('status').textContent='Carregando canais…';
 $('channels').innerHTML='<div class="notice">Carregando catálogo…</div>';
 const params=new URLSearchParams({action:'channels',page:String(currentPage),limit:String(PAGE_SIZE)});
 if(category==='favorites'){if(!favorites.length){all=[];$('status').textContent='0 favoritos';render();totalPages=1;updatePager();return;}params.set('favorites',favorites.join(','));}
 const query=$('search').value.trim();if(query)params.set('q',query);
 if(category!=='all'&&category!=='favorites')params.set('category',category);
 try{
  const response=await fetch(API+'?'+params.toString(),{headers:{Accept:'application/json'}});
  const data=await response.json();if(!response.ok)throw new Error(data.error||`Erro HTTP ${response.status}`);
  if(token!==requestToken)return;
  all=data.channels||[];totalPages=data.totalPages||1;
  $('status').textContent=`${Number(data.total||0).toLocaleString('pt-BR')} resultados`;
  $('listTitle').textContent=category==='favorites'?'Favoritos':category==='all'?'Todos os canais':category;
  render();updatePager();
 }catch(error){
  if(token!==requestToken)return;
  $('status').textContent='Fonte indisponível';
  $('channels').innerHTML='';
  const notice=document.createElement('div');notice.className='notice';
  const title=document.createElement('h3');title.textContent='Não foi possível carregar o catálogo';
  const detail=document.createElement('p');detail.className='error';detail.textContent=error.message||String(error);
  const retry=makeButton('Tentar novamente',true,loadChannels);notice.append(title,detail,retry);$('channels').append(notice);
 }
}
function play(channel){
 const src=safeUrl(channel.url);$('currentName').textContent=channel.name;
 $('currentDesc').textContent=src?'Transmissão selecionada':'Endereço de transmissão indisponível';
 const logo=safeUrl(channel.logo);$('currentLogo').src=logo;$('currentLogo').style.visibility=logo?'visible':'hidden';
 const video=$('video');if(hls){hls.destroy();hls=null;}
 const oldFrame=$('channelFrame');if(oldFrame)oldFrame.remove();
 video.pause();video.removeAttribute('src');video.load();video.style.display='block';
 if(!src)return;
 if(/\.m3u8(?:$|[?#])/i.test(src)&&window.Hls&&Hls.isSupported()){
  hls=new Hls();hls.loadSource(src);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
 }else if(/\.(mp4|webm|ogg)(?:$|[?#])/i.test(src)){
  video.src=src;video.play().catch(()=>{});
 }else{
  video.style.display='none';const frame=document.createElement('iframe');frame.id='channelFrame';frame.src=src;
  frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';frame.allowFullscreen=true;
  frame.title='Player de '+channel.name;frame.style.cssText='width:100%;height:100%;min-height:240px;aspect-ratio:16/9;border:0;background:#000';
  video.parentNode.insertBefore(frame,video.nextSibling);
 }
}
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{currentPage=1;loadChannels()},350)});
$('previousPage').onclick=()=>{if(currentPage>1){currentPage--;loadChannels()}};
$('nextPage').onclick=()=>{if(currentPage<totalPages){currentPage++;loadChannels()}};
function parseM3U(text){
 const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);const channels=[];let entry=null;
 for(const raw of lines){const line=raw.trim();if(!line)continue;
  if(line.startsWith('#EXTINF:')){
   const comma=line.indexOf(',');const info=comma>=0?line.slice(0,comma):line;
   const attr=(name)=>{const m=info.match(new RegExp('(?:^|\\s)'+name+'="([^"]*)"','i'));return m?m[1].trim():''};
   entry={name:(comma>=0?line.slice(comma+1).trim():'')||attr('tvg-name')||'Canal sem nome',logo:attr('tvg-logo'),category:attr('group-title')||'Outros'};continue;
  }
  if(line.startsWith('#'))continue;
  if(entry&&/^https?:\/\//i.test(line)){channels.push({id:line+'|'+entry.name,name:entry.name,logo:entry.logo,category:entry.category,url:line});}
  entry=null;
 }
 return channels;
}
function useCustomChannels(parsed){
 if(!parsed.length)throw new Error('Não encontrei canais válidos nessa lista M3U.');
 customChannels=parsed;category='all';currentPage=1;
 categoryNames=[...new Set(parsed.map(c=>c.category))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 renderCategories();$('playlistMessage').textContent=parsed.length.toLocaleString('pt-BR')+' canais carregados nesta sessão.';
 loadChannels();
}
function useCustomPlaylist(text){useCustomChannels(parseM3U(text))}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function loadLargePlaylist(url){
 const start=await fetch('/.netlify/functions/playlist-start',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({url})});
 const started=await start.json();if(!start.ok)throw new Error(started.error||'Não foi possível iniciar o carregamento.');
 const {id,token}=started;let status;
 for(let attempt=0;attempt<560;attempt++){
  await wait(1500);
  const check=await fetch('/.netlify/functions/playlist-status?id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token},cache:'no-store'});
  status=await check.json();if(!check.ok)throw new Error(status.error||'Falha ao consultar a lista.');
  if(status.state==='complete')break;
  if(status.state==='failed')throw new Error(status.error||'O provedor não conseguiu entregar a lista.');
  $('playlistMessage').textContent=status.state==='downloading'?'Baixando lista do provedor…':'Preparando lista grande…';
 }
 if(!status||status.state!=='complete')throw new Error('O provedor demorou demais para responder. Tente novamente.');
 const total=Number(status.bytes)||0;if(!total||total>100*1024*1024)throw new Error('Tamanho de lista inválido.');
 const decoder=new TextDecoder('utf-8');let pending='',entry=null;const parsed=[];
 const consumeLine=(raw)=>{
  const line=raw.trim();if(!line)return;
  if(line.startsWith('#EXTINF:')){
   const comma=line.indexOf(',');const info=comma>=0?line.slice(0,comma):line;
   const attr=name=>{const m=info.match(new RegExp('(?:^|\\s)'+name+'="([^"]*)"','i'));return m?m[1].trim():''};
   entry={name:(comma>=0?line.slice(comma+1).trim():'')||attr('tvg-name')||'Canal sem nome',logo:attr('tvg-logo'),category:attr('group-title')||'Outros'};return;
  }
  if(line.startsWith('#'))return;
  if(entry&&/^https?:\/\//i.test(line))parsed.push({id:line+'|'+entry.name,name:entry.name,logo:entry.logo,category:entry.category,url:line});
  entry=null;
  if(parsed.length>150000)throw new Error('A lista contém canais demais para este aparelho (limite de 150 mil).');
 };
 let offset=0;
 while(offset<total){
  const part=await fetch('/.netlify/functions/playlist-chunk?id='+encodeURIComponent(id)+'&offset='+offset,{headers:{Authorization:'Bearer '+token},cache:'no-store'});
  if(!part.ok){let data={};try{data=await part.json()}catch{}throw new Error(data.error||'Falha ao receber uma parte da lista.')}
  const bytes=await part.arrayBuffer();if(!bytes.byteLength)throw new Error('A lista foi recebida incompleta.');
  pending+=decoder.decode(bytes,{stream:true});
  const lines=pending.split(/\r?\n/);pending=lines.pop()||'';for(const line of lines)consumeLine(line);
  offset+=bytes.byteLength;$('playlistMessage').textContent='Lendo lista: '+Math.min(100,Math.round(offset/total*100))+'%';
 }
 pending+=decoder.decode();if(pending)consumeLine(pending);
 useCustomChannels(parsed);
}
$('loadPlaylist').onclick=async()=>{
 const url=$('playlistUrl').value.trim();if(!url){$('playlistMessage').textContent='Cole o link M3U primeiro.';return}
 $('loadPlaylist').disabled=true;$('playlistMessage').textContent='Iniciando carregamento seguro…';
 try{await loadLargePlaylist(url)}
 catch(error){$('playlistMessage').textContent=error.message||'Falha ao carregar a lista.'}
 finally{$('loadPlaylist').disabled=false}
};
$('playlistFile').onchange=async(event)=>{
 const file=event.target.files&&event.target.files[0];if(!file)return;
 try{useCustomPlaylist(await file.text())}catch(error){$('playlistMessage').textContent=error.message||'Arquivo inválido.'}
};
$('defaultPlaylist').onclick=()=>{customChannels=null;category='all';currentPage=1;categoryNames=[];renderCategories();$('playlistMessage').textContent='Exibindo os canais padrão.';loadCategories().then(loadChannels).catch(loadChannels)};
async function start(){
 $('status').textContent='Conectando à playlist…';
 try{await loadCategories();await loadChannels();}
 catch(error){$('status').textContent='Falha ao iniciar';$('channels').innerHTML='';const n=document.createElement('div');n.className='notice';n.textContent=error.message||String(error);$('channels').append(n)}
}
start();
</script>
</body></html>
